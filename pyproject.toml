[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datapulse-churn"
version = "0.1.0"
description = "Reproducible customer churn analysis and retention prioritization"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "scikit-learn>=1.5,<2.0",
  "matplotlib>=3.9,<4.0",
  "seaborn>=0.13,<1.0",
  "scipy>=1.13,<2.0",
  "statsmodels>=0.14,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

